<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/" aria-label="NLD Logistics home">
      <span class="brand-mark" aria-hidden="true">NLD</span>
      <span>{{ title }}</span>
    </a>
    <nav>
      @if (auth.isAuthenticated()) {
        <a routerLink="/products">Products</a>
        <a routerLink="/orders">Orders</a>
        <a routerLink="/cart">Cart ({{ cart.itemCount() }})</a>
        <button type="button" (click)="logout()">Sign out</button>
      } @else {
        <a routerLink="/login">Sign in</a>
      }
    </nav>
  </header>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
