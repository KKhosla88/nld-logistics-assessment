services:
  postgres:
    image: postgres:17-alpine
    container_name: nld-logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nld_logistics
      POSTGRES_USER: nld_user
      POSTGRES_PASSWORD: nld_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nld_user -d nld_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:

